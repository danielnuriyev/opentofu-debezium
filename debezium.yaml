apiVersion: v1
kind: Namespace
metadata:
  name: debezium
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: debezium
type: Opaque
stringData:
  accesskey: admin
  secretkey: password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-connect-jmx-exporter
  namespace: debezium
  labels:
    app: debezium-connect
data:
  config.yaml: |
    hostPort: 127.0.0.1:9999
    startDelaySeconds: 0
    ssl: false
    lowercaseOutputName: false
    lowercaseOutputLabelNames: false
    rules:
      - pattern: ".*"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-connect
  namespace: debezium
  labels:
    app: debezium-connect
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: debezium-connect
  template:
    metadata:
      labels:
        app: debezium-connect
    spec:
      initContainers:
        - name: init-logs
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /kafka/logs && chmod 777 /kafka/logs
          volumeMounts:
            - name: logs
              mountPath: /kafka/logs
        - name: create-topics
          image: apache/kafka:4.3.1
          env:
            - name: BOOTSTRAP
              value: kafka.kafka.svc.cluster.local:9092
          volumeMounts:
            - name: logs
              mountPath: /kafka/logs
          command:
            - sh
            - -c
            - |
              {
                set -e
                for t in debezium_connect_configs:1:compact debezium_connect_offsets:25:compact debezium_connect_statuses:5:compact; do
                  topic="${t%%:*}"
                  rest="${t#*:}"
                  parts="${rest%%:*}"
                  policy="${rest##*:}"
                  if ! /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --describe --topic "$topic" >/dev/null 2>&1; then
                    /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --create --topic "$topic" --partitions "$parts" --replication-factor 2 --config cleanup.policy="$policy"
                  fi
                  /opt/kafka/bin/kafka-configs.sh --bootstrap-server "$BOOTSTRAP" --alter --entity-type topics --entity-name "$topic" --add-config cleanup.policy="$policy"
                  echo "ready $topic (partitions=$parts, cleanup=$policy)"
                done
              } >> /kafka/logs/create-topics.log 2>&1
        - name: fetch-jmx-exporter
          image: curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              curl -fsSL -o /jmx/jmx_prometheus_httpserver.jar \
                https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_httpserver/1.0.1/jmx_prometheus_httpserver-1.0.1.jar
          volumeMounts:
            - name: jmx-jar
              mountPath: /jmx
      containers:
        - name: connect
          image: quay.io/debezium/connect:3.1.3.Final
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: BOOTSTRAP_SERVERS
              value: kafka.kafka.svc.cluster.local:9092
            - name: GROUP_ID
              value: debezium
            - name: CONFIG_STORAGE_TOPIC
              value: debezium_connect_configs
            - name: OFFSET_STORAGE_TOPIC
              value: debezium_connect_offsets
            - name: STATUS_STORAGE_TOPIC
              value: debezium_connect_statuses
            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: "2"
            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: "2"
            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: "2"
            - name: KEY_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: VALUE_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: OFFSET_FLUSH_INTERVAL_MS
              value: "5000"
            - name: CONNECT_PLUGIN_DISCOVERY
              value: "only_scan"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx512m"
            - name: KAFKA_JMX_OPTS
              value: "-Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.port=9999 -Dcom.sun.management.jmxremote.rmi.port=9999 -Dcom.sun.management.jmxremote.local.only=true -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=127.0.0.1"
            - name: CONNECT_LOG4J_LOGGERS
              value: "INFO, connectFile"
            - name: CONNECT_LOG4J_APPENDER_CONNECTFILE
              value: org.apache.log4j.DailyRollingFileAppender
            - name: CONNECT_LOG4J_APPENDER_CONNECTFILE_FILE
              value: /kafka/logs/connect.log
            - name: CONNECT_LOG4J_APPENDER_CONNECTFILE_LAYOUT
              value: org.apache.log4j.PatternLayout
            - name: CONNECT_LOG4J_APPENDER_CONNECTFILE_LAYOUT_CONVERSIONPATTERN
              value: "%d{ISO8601} %p %m (%c) [%t]%n"
            - name: CONNECT_LOG4J_APPENDER_CONNECTFILE_DATEPATTERN
              value: "'.'yyyy-MM-dd"
          volumeMounts:
            - name: logs
              mountPath: /kafka/logs
          readinessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
        - name: jmx-exporter
          image: eclipse-temurin:17-jre-jammy
          command:
            - java
            - -jar
            - /jmx/jmx_prometheus_httpserver.jar
            - "9404"
            - /etc/jmx-exporter/config.yaml
          ports:
            - containerPort: 9404
              name: metrics
          volumeMounts:
            - name: jmx-exporter-config
              mountPath: /etc/jmx-exporter
            - name: jmx-jar
              mountPath: /jmx
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
        - name: log-sync
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: accesskey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretkey
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              until mc alias set minio http://minio.minio.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio"
                sleep 5
              done
              mc mb minio/kafka --ignore-existing
              while true; do
                for f in /kafka/logs/*; do
                  [ -f "$f" ] || continue
                  mc cp "$f" "minio/kafka/logs/debezium/${POD_NAME}/$(basename "$f")" || true
                done
                sleep 15
              done
          volumeMounts:
            - name: logs
              mountPath: /kafka/logs
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: logs
          emptyDir: {}
        - name: jmx-jar
          emptyDir: {}
        - name: jmx-exporter-config
          configMap:
            name: debezium-connect-jmx-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: debezium-connect
  namespace: debezium
  labels:
    app: debezium-connect
spec:
  selector:
    app: debezium-connect
  ports:
    - name: http
      port: 8083
      targetPort: 8083
    - name: metrics
      port: 9404
      targetPort: 9404
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: debezium-connect
  namespace: debezium
  labels:
    app: debezium-connect
    release: kube-prometheus
spec:
  selector:
    matchLabels:
      app: debezium-connect
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
